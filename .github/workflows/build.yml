# Every push: Windows and Linux checks, exact-artifact smoke tests and both build artifacts.
# One downstream job publishes both artifacts together on a tag v*.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe gives the version

      - uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-${{ hashFiles('tools/build.ps1', 'tools/build-assets.json', 'tools/requirements*.txt', 'tools/constraints.txt') }}
          restore-keys: downloads-

      - name: Dev runtime
        shell: cmd
        run: tools\build.bat dev

      - name: Checks
        shell: cmd
        run: |
          runtime\python.exe -m pytest || exit /b 1
          runtime\python.exe -m pytest -m slow || exit /b 1
          runtime\python.exe -m mypy || exit /b 1
          runtime\python.exe -m ruff check || exit /b 1

      - name: Release zip
        shell: cmd
        run: tools\build.bat release

      - name: Smoke test of the zip
        shell: pwsh
        run: |
          runtime\python.exe -X utf8 tools\smoke_test.py (Get-Item dist\ozvuchka-*.zip).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ozvuchka-zip
          path: dist/ozvuchka-*.zip
          retention-days: 14
          compression-level: 0 # it is a zip already

  linux:
    name: Linux build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # match the Windows version naming

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-linux-${{ hashFiles('tools/setup_linux.py', 'tools/download_linux_python.py', 'tools/build-assets.json', 'tools/requirements*.txt', 'tools/constraints.txt') }}
          restore-keys: downloads-linux-

      - name: Dev runtime
        run: python tools/setup_linux.py

      - name: Checks
        run: |
          runtime-linux/bin/python -m pytest
          runtime-linux/bin/python -m pytest -m slow
          runtime-linux/bin/python -m mypy
          runtime-linux/bin/python -m ruff check

      - name: Linux release archive
        run: python tools/build_linux.py

      - name: Smoke test of the exact Linux archive
        run: runtime-linux/bin/python -X utf8 tools/smoke_test.py dist/ozvuchka-*-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ozvuchka-linux-tar
          path: dist/ozvuchka-*-linux-x86_64.tar.gz
          retention-days: 14
          compression-level: 0 # it is already compressed

  linux-minimum:
    name: Linux checks and archive smoke (glibc 2.29)
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-linux-${{ hashFiles('tools/setup_linux.py', 'tools/download_linux_python.py', 'tools/build-assets.json', 'tools/requirements*.txt', 'tools/constraints.txt') }}
          restore-keys: downloads-linux-

      - name: Baseline CPython for the minimum environment
        run: python tools/download_linux_python.py

      - name: Show the minimum environment
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            fedora@sha256:3a0c8c86d8ac2d1bbcfd08d40d3b757337f7916fb14f40efcb1d1137a4edef45 \
            /workspace/.cache/linux-python/python/bin/python3.12 \
            -c 'import platform; print(platform.platform()); print(platform.libc_ver()); assert platform.libc_ver() == ("glibc", "2.29")'

      - name: Dev runtime on minimum glibc
        run: |
          docker run --rm --env SSL_CERT_FILE=/etc/pki/tls/certs/ca-bundle.crt \
            -v "$PWD:/workspace" -w /workspace \
            fedora@sha256:3a0c8c86d8ac2d1bbcfd08d40d3b757337f7916fb14f40efcb1d1137a4edef45 \
            /workspace/.cache/linux-python/python/bin/python3.12 tools/setup_linux.py

      - name: Offline development checks on minimum glibc
        run: |
          docker run --rm --network none -v "$PWD:/workspace" -w /workspace \
            fedora@sha256:3a0c8c86d8ac2d1bbcfd08d40d3b757337f7916fb14f40efcb1d1137a4edef45 \
            bash -lc 'runtime-linux/bin/python -m pytest && runtime-linux/bin/python -m pytest -m slow && runtime-linux/bin/python -m mypy && runtime-linux/bin/python -m ruff check'

      - name: Download the exact Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ozvuchka-linux-tar
          path: dist

      - name: Offline archive smoke on minimum glibc
        run: |
          docker run --rm --network none -v "$PWD:/workspace" -w /workspace \
            fedora@sha256:3a0c8c86d8ac2d1bbcfd08d40d3b757337f7916fb14f40efcb1d1137a4edef45 \
            bash -lc '/workspace/.cache/linux-python/python/bin/python3.12 -X utf8 tools/smoke_test.py /workspace/dist/ozvuchka-*-linux-x86_64.tar.gz'

  release:
    name: Publish both platform artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux, linux-minimum]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ozvuchka-zip
          path: release/windows

      - name: Download the Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ozvuchka-linux-tar
          path: release/linux

      - name: Create or update one GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/windows/*.zip release/linux/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/windows/*.zip release/linux/*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
          fi
