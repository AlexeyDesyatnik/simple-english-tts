# On every push: Windows checks and release smoke, plus Linux checks on current Ubuntu and minimum glibc.
# On a tag v*, the Windows zip is also published in GitHub Releases. Linux packaging/publication is stage 5.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # to publish the release on a tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe gives the version

      - uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-${{ hashFiles('tools/build.ps1', 'tools/build-assets.json', 'tools/requirements*.txt', 'tools/constraints.txt') }}
          restore-keys: downloads-

      - name: Dev runtime
        shell: cmd
        run: tools\build.bat dev

      - name: Checks
        shell: cmd
        run: |
          runtime\python.exe -m pytest || exit /b 1
          runtime\python.exe -m pytest -m slow || exit /b 1
          runtime\python.exe -m mypy || exit /b 1
          runtime\python.exe -m ruff check || exit /b 1

      - name: Release zip
        shell: cmd
        run: tools\build.bat release

      - name: Smoke test of the zip
        shell: pwsh
        run: |
          runtime\python.exe -X utf8 tools\smoke_test.py (Get-Item dist\ozvuchka-*.zip).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ozvuchka-zip
          path: dist/ozvuchka-*.zip
          retention-days: 14
          compression-level: 0 # it is a zip already

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-Item dist\ozvuchka-*.zip).FullName --title $env:GITHUB_REF_NAME --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-linux-${{ hashFiles('tools/setup_linux.py', 'tools/download_linux_python.py', 'tools/build-assets.json', 'tools/requirements*.txt', 'tools/constraints.txt') }}
          restore-keys: downloads-linux-

      - name: Dev runtime
        run: python tools/setup_linux.py

      - name: Checks
        run: |
          runtime-linux/bin/python -m pytest
          runtime-linux/bin/python -m pytest -m slow
          runtime-linux/bin/python -m mypy
          runtime-linux/bin/python -m ruff check

  linux-minimum:
    name: Linux checks (glibc 2.29)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-linux-${{ hashFiles('tools/setup_linux.py', 'tools/download_linux_python.py', 'tools/build-assets.json', 'tools/requirements*.txt', 'tools/constraints.txt') }}
          restore-keys: downloads-linux-

      - name: Baseline CPython for the minimum environment
        run: python tools/download_linux_python.py

      - name: Show the minimum environment
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            fedora@sha256:3a0c8c86d8ac2d1bbcfd08d40d3b757337f7916fb14f40efcb1d1137a4edef45 \
            /workspace/.cache/linux-python/python/bin/python3.12 \
            -c 'import platform; print(platform.platform()); print(platform.libc_ver()); assert platform.libc_ver() == ("glibc", "2.29")'

      - name: Dev runtime on minimum glibc
        run: |
          docker run --rm --env SSL_CERT_FILE=/etc/pki/tls/certs/ca-bundle.crt \
            -v "$PWD:/workspace" -w /workspace \
            fedora@sha256:3a0c8c86d8ac2d1bbcfd08d40d3b757337f7916fb14f40efcb1d1137a4edef45 \
            /workspace/.cache/linux-python/python/bin/python3.12 tools/setup_linux.py

      - name: Offline checks on minimum glibc
        run: |
          docker run --rm --network none -v "$PWD:/workspace" -w /workspace \
            fedora@sha256:3a0c8c86d8ac2d1bbcfd08d40d3b757337f7916fb14f40efcb1d1137a4edef45 \
            bash -lc 'runtime-linux/bin/python -m pytest && runtime-linux/bin/python -m pytest -m slow && runtime-linux/bin/python -m mypy && runtime-linux/bin/python -m ruff check'
