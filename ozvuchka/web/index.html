<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Озвучка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></symbol>
    <symbol id="icon-previous" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm12 0v12l-9-6z"/></symbol>
    <symbol id="icon-next" viewBox="0 0 24 24"><path d="m6 6 9 6-9 6zm10 0h2v12h-2z"/></symbol>
    <symbol id="icon-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4V7H7a3 3 0 0 0-3 3v2H2v-2a5 5 0 0 1 5-5h10zm-10 20-4-4 4-4v3h10a3 3 0 0 0 3-3v-2h2v2a5 5 0 0 1-5 5H7z"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><path d="m19.6 18-4.2-4.2a7 7 0 1 0-1.6 1.6l4.2 4.2zM5 10a5 5 0 1 1 10 0 5 5 0 0 1-10 0z"/></symbol>
  </svg>
  <main>
    <header class="app-header">
      <h1>Озвучка</h1>
    </header>
    <div class="workspace">
      <div class="side-column">
        <section id="library-panel" class="surface" aria-labelledby="library-heading">
          <div class="library-header">
            <h2 id="library-heading">Библиотека</h2>
            <button id="new-text" type="button" class="secondary">
              <svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg>
              <span>Новый текст</span>
            </button>
          </div>
          <div class="library-tools">
            <div class="search-field">
              <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
              <input id="library-search" type="search" placeholder="Поиск по названию" aria-label="Поиск по названию">
            </div>
            <span id="library-size" class="muted"></span>
          </div>
          <ul id="library"></ul>
        </section>
        <section id="queue-panel" class="surface" aria-labelledby="queue-heading" hidden>
          <h2 id="queue-heading">Очередь озвучки</h2>
          <ol id="queue"></ol>
        </section>
      </div>
      <section id="editor-panel" class="surface" aria-labelledby="source-label">
        <div class="editor-heading">
          <label id="source-label" for="source">Текст для озвучки</label>
          <span id="save-state" class="save-state"></span>
        </div>
        <textarea id="source" rows="7" placeholder="Вставьте английский текст: каждая строка — отдельный абзац"></textarea>
        <div id="voice-panel" aria-label="Настройки озвучки">
          <div class="voice-fields">
            <label class="field">
              <span>Голос</span>
              <select id="voices"></select>
            </label>
            <button id="listen-voice" type="button" class="secondary">
              <svg class="icon" aria-hidden="true"><use href="#icon-volume"/></svg>
              <span>Послушать</span>
            </button>
            <label class="field speed-field">
              <span>Скорость</span>
              <select id="speed"></select>
            </label>
          </div>
        </div>
        <div class="playback-bar">
          <div class="controls" role="group" aria-label="Управление воспроизведением">
            <button id="previous" type="button" class="secondary icon-button playback-only" title="Предыдущий абзац" aria-label="Предыдущий абзац">
              <svg class="icon" aria-hidden="true"><use href="#icon-previous"/></svg>
            </button>
            <button id="play" type="button" class="primary">
              <svg class="icon" aria-hidden="true"><use href="#icon-play"/></svg>
              <span>Слушать</span>
            </button>
            <button id="repeat" type="button" class="secondary icon-button playback-only" title="Повторить абзац" aria-label="Повторить абзац">
              <svg class="icon" aria-hidden="true"><use href="#icon-repeat"/></svg>
            </button>
            <button id="next" type="button" class="secondary icon-button playback-only" title="Следующий абзац" aria-label="Следующий абзац">
              <svg class="icon" aria-hidden="true"><use href="#icon-next"/></svg>
            </button>
            <button id="stop" type="button" class="secondary">
              <svg class="icon" aria-hidden="true"><use href="#icon-stop"/></svg>
              <span>Стоп</span>
            </button>
            <button id="enqueue" type="button" class="secondary">
              <svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg>
              <span>В очередь</span>
            </button>
            <span class="text-size" role="group" aria-label="Размер текста">
              <button id="smaller" type="button" class="secondary" title="Мельче" aria-label="Уменьшить текст">A−</button>
              <button id="bigger" type="button" class="secondary" title="Крупнее" aria-label="Увеличить текст">A+</button>
            </span>
          </div>
          <div class="status-area">
            <p id="status" role="status"></p>
            <progress id="synthesis-progress" aria-label="Озвучено абзацев" hidden></progress>
          </div>
        </div>
      </section>
    </div>
    <ol id="paragraphs" aria-label="Текст по абзацам"></ol>
  </main>
  <script src="app.js"></script>
</body>
</html>
