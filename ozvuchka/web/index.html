<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Озвучка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Озвучка</h1>
    <textarea id="source" rows="6" placeholder="Вставьте английский текст: каждая строка — отдельный абзац"></textarea>
    <div class="controls">
      <button id="play" type="button">Play</button>
      <button id="pause" type="button" class="secondary">Пауза</button>
      <button id="stop" type="button" class="secondary">Стоп</button>
    </div>
    <p id="status" role="status"></p>
    <p id="voice" class="muted"></p>
    <ol id="paragraphs"></ol>
  </main>
  <script src="app.js"></script>
</body>
</html>
