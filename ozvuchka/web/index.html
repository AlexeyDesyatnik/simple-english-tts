<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Озвучка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Озвучка</h1>
    <section id="library-panel">
      <div class="library-header">
        <h2>Библиотека</h2>
        <button id="new-text" type="button" class="secondary">Новый текст</button>
      </div>
      <ul id="library"></ul>
    </section>
    <section id="queue-panel" hidden>
      <h2>Очередь озвучки</h2>
      <ol id="queue"></ol>
    </section>
    <fieldset id="voice-panel">
      <legend>Голос</legend>
      <ul id="voices"></ul>
      <label>Скорость <select id="speed"></select></label>
    </fieldset>
    <textarea id="source" rows="6" placeholder="Вставьте английский текст: каждая строка — отдельный абзац"></textarea>
    <div class="controls">
      <button id="play" type="button">Play</button>
      <button id="pause" type="button" class="secondary">Пауза</button>
      <button id="stop" type="button" class="secondary">Стоп</button>
      <button id="enqueue" type="button" class="secondary">В очередь</button>
      <span class="text-size">
        <button id="smaller" type="button" class="secondary" title="Мельче">A−</button>
        <button id="bigger" type="button" class="secondary" title="Крупнее">A+</button>
      </span>
    </div>
    <p id="status" role="status"></p>
    <ol id="paragraphs"></ol>
  </main>
  <script src="app.js"></script>
</body>
</html>
